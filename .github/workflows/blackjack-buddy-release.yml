# Builds the Blackjack Buddy Windows installer and publishes it as a GitHub Release.
# The installed game checks these releases and updates itself.
# Run it from the Actions tab ("Run workflow") after bumping "version" in blackjack-buddy/package.json.
name: Blackjack Buddy release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: blackjack-buddy
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blackjack-buddy/package-lock.json
      - run: npm ci
      - name: Tag this version and open one draft release for it
        # electron-builder uploads the installer and its blockmap in parallel; with no release yet, each upload
        # creates its own and the files end up split across two releases. So the release exists before it runs.
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag exists"; else
            git tag "$tag" && git push origin "refs/tags/$tag"; fi
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "[.[] | select(.tag_name == \"$tag\")] | length")
          if [ "$n" -gt 0 ]; then echo "::error::A release for $tag already exists. Bump the version in package.json first."; exit 1; fi
          gh release create "$tag" --draft --title "${tag#v}" --notes "Blackjack Buddy ${tag#v}"
      - name: Build installer and upload it to the draft
        run: npx electron-builder --win nsis --publish always
      - name: Check all three files are there, then publish
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          [ "$(echo "$id" | wc -w)" -eq 1 ] || { echo "::error::Expected one release for $TAG, found: $id"; exit 1; }
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[].name')
          echo "$names"
          for f in "Blackjack-Buddy-Setup-${TAG#v}.exe" "Blackjack-Buddy-Setup-${TAG#v}.exe.blockmap" latest.yml; do
            echo "$names" | grep -qxF "$f" || { echo "::error::$f missing from the release"; exit 1; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=true >/dev/null
          echo "Published $TAG"
