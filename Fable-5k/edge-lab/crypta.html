<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypta · Fable 5k helper</title>
<link rel="manifest" href="/crypta.webmanifest"><link rel="icon" href="/crypta.svg" type="image/svg+xml"><meta name="theme-color" content="#1f8a8a">
<style>html,body{margin:0;height:100%;background:#fbfaf7}@media (prefers-color-scheme:dark){html,body{background:#1d1b24}}#cryptaRoot{--c-bg:var(--card,#fbfaf7);--c-ink:var(--ink,#1c1a22);--c-mut:var(--muted,#6b6873);--c-line:var(--line,#dedad2);--c-acc:#1f8a8a;--c-acc2:#6b3fa0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--c-ink)}
.crypta-fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;border:2px solid var(--c-acc);background:var(--c-bg);padding:6px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:2147483000;transition:transform .15s}
.crypta-fab:hover{transform:translateY(-2px)}.crypta-fab.open{border-color:var(--c-acc2)}.crypta-fab svg{width:100%;height:100%;image-rendering:pixelated}
.crypta-panel{position:fixed;right:18px;bottom:90px;width:min(400px,calc(100vw - 36px));height:min(620px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--c-bg);border:1px solid var(--c-line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);z-index:2147483000;overflow:hidden}
.crypta-panel[hidden]{display:none}
.crypta-standalone .crypta-panel{position:static;width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
.crypta-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--c-line);background:linear-gradient(90deg,rgba(31,138,138,.10),rgba(107,63,160,.08))}
.crypta-head strong{display:block;font-size:15px;letter-spacing:.02em}
.crypta-ava{width:38px;height:38px;border-radius:10px;background:#f4efe6;border:1px solid var(--c-line);padding:3px;flex:none}.crypta-ava svg{width:100%;height:100%}
.crypta-mode{display:block;font-size:11.5px;color:var(--c-mut)}.crypta-mode.ai{color:var(--c-acc)}
.crypta-sp{flex:1}.crypta-head button{background:transparent;border:1px solid transparent;border-radius:8px;color:var(--c-ink);font-size:15px;width:32px;height:32px;cursor:pointer}
.crypta-head button:hover{border-color:var(--c-line)}
.crypta-statusline{font-size:12px;color:var(--c-mut);padding:6px 12px;border-bottom:1px solid var(--c-line)}
.crypta-settings{padding:10px 12px;border-bottom:1px solid var(--c-line);display:grid;gap:8px;font-size:13px;max-height:45%;overflow:auto}
.crypta-settings label{display:grid;gap:4px}.crypta-settings .crypta-row{display:flex;gap:8px;align-items:center}
.crypta-settings select,.crypta-settings input[type=number]{font:inherit;padding:5px 8px;border:1px solid var(--c-line);border-radius:7px;background:transparent;color:inherit}
.crypta-settings button,.crypta-chips button{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--c-line);border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.crypta-note{margin:0;color:var(--c-mut);font-size:12.5px}
.crypta-log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.crypta-msg{display:flex;gap:8px;max-width:92%}.crypta-msg.user{align-self:flex-end}
.crypta-msg .crypta-text{padding:8px 11px;border-radius:12px;border:1px solid var(--c-line);overflow-wrap:anywhere}
.crypta-msg.user .crypta-text{background:rgba(31,138,138,.12);border-color:rgba(31,138,138,.35)}
.crypta-msg .crypta-text p{margin:0 0 6px}.crypta-msg .crypta-text p:last-child{margin:0}.crypta-msg .crypta-text ul,.crypta-msg .crypta-text ol{margin:4px 0 6px 18px;padding:0}
.crypta-msg .crypta-text code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:rgba(0,0,0,.06);padding:0 4px;border-radius:4px}
.crypta-mini{width:26px;height:26px;flex:none;margin-top:2px}.crypta-mini svg{width:100%;height:100%}
.crypta-msg.streaming .crypta-text:empty::after,.crypta-msg.streaming .crypta-text::after{content:'▍';animation:cryptaBlink 1s steps(2) infinite;color:var(--c-acc)}
@keyframes cryptaBlink{50%{opacity:0}}
.crypta-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}.crypta-chips:empty{display:none}
.crypta-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--c-line)}
.crypta-form textarea{flex:1;resize:none;font:inherit;padding:8px 10px;border:1px solid var(--c-line);border-radius:10px;background:transparent;color:inherit;max-height:120px}
.crypta-form button{width:42px;border:0;border-radius:10px;background:var(--c-acc);color:#fff;font-size:16px;cursor:pointer}
.crypta-glow{outline:3px solid #f0c040!important;outline-offset:3px;box-shadow:0 0 0 8px rgba(240,192,64,.25)!important;transition:outline-color .3s}
@media (prefers-color-scheme:dark){#cryptaRoot:not(.crypta-light){--c-bg:var(--card,#1d1b24);--c-ink:var(--ink,#ece9f2);--c-line:var(--line,#35313f)}.crypta-ava{background:#2a2633}}
@media (prefers-reduced-motion:reduce){.crypta-fab{transition:none}.crypta-msg.streaming .crypta-text::after{animation:none}}
.crypta-panel:not([hidden]){resize:both;min-width:320px;min-height:380px;max-width:calc(100vw - 24px);max-height:calc(100vh - 100px)}
.crypta-standalone .crypta-panel{resize:none;max-width:none;max-height:none}
.crypta-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.crypta-tools{display:flex;flex-wrap:wrap;gap:4px}.crypta-tools:empty{display:none}
.crypta-chip-tool{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(31,138,138,.12);color:var(--c-acc);border:1px solid rgba(31,138,138,.3)}
.crypta-chip-tool.bad{background:rgba(200,60,60,.1);color:#c04040;border-color:rgba(200,60,60,.3)}
.crypta-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}.crypta-msg:hover .crypta-actions,.crypta-msg:focus-within .crypta-actions{opacity:1}
.crypta-actions button{font:inherit;font-size:11.5px;padding:1px 8px;border:1px solid var(--c-line);border-radius:999px;background:transparent;color:var(--c-mut);cursor:pointer}
.crypta-msg .crypta-text pre{margin:4px 0;padding:8px;background:rgba(0,0,0,.06);border-radius:8px;overflow:auto;font-size:12.5px}
.crypta-table{overflow-x:auto;margin:4px 0}.crypta-table table{border-collapse:collapse;font-size:12.5px}.crypta-table th,.crypta-table td{border:1px solid var(--c-line);padding:3px 7px;text-align:left}
.crypta-msg .crypta-text a{color:var(--c-acc)}.crypta-h{margin-top:6px!important}
.crypta-msg.assistant{max-width:96%}
.crypta-box{border:1px solid var(--c-line);border-radius:10px;padding:8px 10px;display:grid;gap:6px}
.crypta-dl{display:grid;gap:4px}.crypta-dl button{text-align:left;border-radius:8px}
.crypta-settings a{color:var(--c-acc)}
</style>

<script>/* ============ Crypta — the Fable 5k helper ============
   Runs inside both tools (floating button, bottom right) and as her own installable window at /crypta.
   - Guide mode (no key): answers from the built-in guide plus live explanations of your numbers.
   - AI mode (Anthropic key in private/): Claude answers through the launcher, which holds the key, fixes the
     prompt and tools, and enforces a monthly spending cap. The page never sees the key.
   - Tools she can use: switch tab, point at a field, refresh Capital plan, open trades to log. Nothing that
     trades, moves money or changes the study.
   - Anything that looks like an API key or private key is refused before it leaves this page. */
(function(){
  if(window.__crypta)return;window.__crypta=true;
  const GUIDE=[{"title":"What Fable 5k is","text":"Fable 5k is a research and discipline workspace for a $5,000 crypto experiment on Coinbase. It never places orders and cannot move money. It tells you how big a trade may be, records what happened, and stops you when the experiment's loss limits are reached. There are two tools: the Daily desk (daily routine, sizing, journal) and the Pooled strategy lab (testing rule ideas across coins). Keep live trades in the desk journal only."},{"title":"Starting the app","text":"Double-click START-WINDOWS.bat and leave the black window open. It must print \"Live data: OK\" twice. With a Coinbase View-only key it also prints \"Account: OK View-only key accepted\". Closing that window stops live data; pages then say \"Launcher not reachable\". Double-clicking the launcher again just reopens the running app at the same address, so your saved data stays visible."},{"title":"Daily routine","text":"After 00:05 UTC: open the Daily desk, press Scan daily markets, download the scan. Before any real trade, open Capital plan: it fills itself and calculates. Place exactly the order on the trade ticket in Coinbase, including the stop-limit. After a trade closes, open the Journal and tap one button to log it. Export the backup file and confirm it saved."},{"title":"Capital plan","text":"Capital plan sizes a trade so a stop-out loses at most the risk budget. It fills itself: live mid price, stop at the 30-day low, slippage from half the live spread (minimum 1 basis point), and, with a View-only key, equity, cash, open risk, high-water mark and your Coinbase fee tier. Any number you type is kept; clear a field to hand it back to autofill. Change Asset to plan another coin. Autofilled fields have a green left edge; hover to see the source."},{"title":"Risk budget and limits","text":"Per-trade risk is 0.5% of equity ($25 at $5,000). Total open risk across positions is capped at 1% of equity. A single position is capped at 25% of equity. Stages: within limits; review at $4,500 (per-trade risk halved); no new risk at $4,250 (size $0); hard pause at the higher of $4,000 or $1,000 below the high-water mark. These limits come from the locked protocol and cannot be raised in the app."},{"title":"Trade ticket","text":"The ticket under the Capital plan result is the exact order to place: quantity rounded down to Coinbase's step, stop and stop-limit prices rounded to its tick, with Copy buttons. It shows the loss if the stop-limit fills at its limit, which never exceeds the risk budget. Stop-limit gap % sets how far below the stop the limit sits (default 0.2%). A limit entry at the maker fee allows a larger size for the same risk but may not fill. If price gaps below the limit, the stop-limit does not fill and the position is unprotected."},{"title":"Open risk","text":"Open risk counts each position down to its Coinbase stop orders: quantity × (price − the lower of stop and limit + that price × fee). A position with no stop order, or whose stop-limit the price has already fallen through, counts at full value. Place a stop in Coinbase to free the room."},{"title":"Cooling-off","text":"Two losing trades closed within 24 hours stop new sizing until the older loss is 24 hours old. The rule is fixed and has no override. Old trades logged by hand use their Closed on date, so logging last week's losses does not trigger it."},{"title":"Journal: log trades in one tap","text":"Opening the Journal lists every unlogged Coinbase round trip from the last 120 days, all coins. Tap Followed, Partly or Didn't to log it with size, entry, exit, fees, close time and the planned price. Trades with no plan before them get Log (no plan). The review shows gross P&L, fees, net P&L, fees as a share of profit, the saving at maker fees, and results split by whether you followed the plan. With few trades those splits are anecdotes, not evidence."},{"title":"Deposits and withdrawals","text":"Money you add is not profit. Every account read re-checks Coinbase transfer history and offers Use when it disagrees with Net deposits; Keep my figure silences it until Coinbase's number changes. Capital plan uses experiment equity = Coinbase total − net deposits. Money that arrived before Fable first read the account is the starting balance. The high-water mark shifts with each correction."},{"title":"Equity history and backup","text":"Each day Capital plan reads the account it records equity, high-water mark and stage, charted against $4,500, $4,250 and the hard floor. The desk backup file carries the journal, register, equity log, high-water mark, net deposits, plan history and logged trades. Clearing browser data without a backup loses them. Import never lowers a recorded high-water mark."},{"title":"Tax CSV","text":"The Journal's Tax CSV builds Form 8949-style lines for a year from every Coinbase fill: FIFO lots per coin (USD and USDC books combined), fees added to cost and taken from proceeds, holding period, sales without a matching purchase flagged. It is not tax advice; Coinbase's 1099-DA may use a different method. Reconcile with your CPA."},{"title":"Connecting Coinbase","text":"Create a Secret API key in the Coinbase Developer Platform with View permission only, ECDSA signature algorithm, scoped to the portfolio that holds the experiment money. Download its JSON file and save it in the private folder. The launcher refuses keys that can trade or transfer. Never paste a key into a chat, including this one. A Client API key does not work."},{"title":"Connecting Crypta's AI","text":"Without a brain Crypta answers from this built-in guide. There are two brains: a free local model through Ollama (see \"Crypta's free local brain\") or Claude. For full answers, create an Anthropic API key at console.anthropic.com. A Claude Pro subscription does not include API credits; the API is paid for separately there. Save the key as a text file in the private folder (for example private/anthropic-key.txt); no restart needed. The key never reaches the page. Set a monthly spending cap in Crypta's settings; Crypta refuses requests past it."},{"title":"Live market strip","text":"The strip at the top shows BTC, ETH and SOL last price, 24-hour change and range, 24-hour volume and bid/ask spread, refreshed every 30 seconds. It is context only; nothing in the study, scanner or sizing uses it. If Coinbase's Exchange host is unreachable, prices come from Coinbase Advanced and the launcher says \"via Advanced fallback\"."},{"title":"Daily scan and the locked study","text":"Scan daily markets reads every Coinbase USD pair and completed daily candles for BTC, ETH and SOL, and records the two frozen BTC hypotheses: H1, the 20-day moving average crossing above the 120-day; H2, a close above the 60-day high with an exit on a close below the 30-day low. They were frozen before any data was seen and are paper only. The desk records what they say; it does not tell you to trade them."},{"title":"Strategy lab and trial budget","text":"The lab tests rule ideas across coins. Every run spends a trial; the budget tab estimates how many configurations the data can support before a winner is likely luck. Passing needs a Deflated Sharpe Ratio of at least 0.95 against buy-and-hold. So far moving-average cross scored 0.908, breakout 0.820 and RSI 0.024 on BTC: all failed. Locking a test before running it keeps the result honest; changing the rule or data after locking voids the lock."},{"title":"Troubleshooting: Live data FAIL, Account FAIL, empty register","text":"\"Live data: FAIL\" names the cause: SSL certificates (on macOS run Install Certificates.command), DNS or offline, a VPN or region block (HTTP 403), rate limit, or a block page. \"Account: FAIL\" with HTTP 401 means the key was rejected: check it is not deleted, the PC clock is automatic, and it uses ECDSA. If the saved register looks empty, check the address is 127.0.0.1:8765 in the same browser. Run the launcher with --check to re-test connections."},{"title":"Crypta's free local brain","text":"Crypta can run on a free model on your own PC through Ollama. Install Ollama from ollama.com/download and start it. In Crypta's settings (⚙) the Local model box then offers one-click downloads: Qwen3 8B (about 5 GB, best, needs about 16 GB of RAM) or Qwen3 4B (about 2.5 GB, for 8 GB of RAM). When the download finishes she switches to it automatically; Brain = Automatic uses Claude if an Anthropic key is present, otherwise the local model, otherwise the guide. Local answers are free and never leave your PC, but they are slower and less sharp than Claude, especially on long multi-step questions."},{"title":"Crypta on your taskbar","text":"Open Crypta's own window with the ⧉ button in her chat, or go to 127.0.0.1:8765/crypta. In Edge or Chrome choose Install (the install icon in the address bar, or Crypta's settings → Install on taskbar), then right-click her taskbar icon and pick Pin to taskbar. Her window works next to the Daily desk: she sees the desk you used last and can switch its tabs. If the launcher is not running she still opens and says so."},{"title":"What Crypta will not do","text":"Crypta explains the app and your numbers, and can move between tabs or point at a field. She can read any tab, the Journal, the register, the account snapshot, the daily scan and live market data, but only reads. She does not predict prices, pick trades, or help work around the loss limits, cooling-off or study locks. She cannot place orders or see your keys."}];

      +'<div class="crypta-box"><strong>Local model (free)</strong> · '+(loc.running?(loc.installed.length?'Ollama running':'Ollama running, no model yet'):'Ollama not found')
        +(loc.running&&loc.installed.length?'<label>Model<select id="cryptaLocalModel">'+loc.installed.map(m=>opt(m,m,m===localModel())).join('')+'</select></label>':'')
        +(loc.running?'<div class="crypta-dl">'+loc.recommended.filter(r=>!loc.installed.includes(r.model)).map(r=>'<button type="button" data-pull="'+esc(r.model)+'">Download '+esc(r.label)+'</button>').join('')+'</div><div id="cryptaPull" class="crypta-note"></div>'
          :'<p class="crypta-note">Install Ollama from <a href="https://ollama.com/download" target="_blank" rel="noopener noreferrer">ollama.com/download</a> (free), start it, then press Refresh. Then download a model here with one click. Answers are slower and less sharp than Claude, but free and private: nothing leaves your PC.</p>')
        +'<button type="button" id="cryptaRefresh">Refresh</button></div>'
      +'<div class="crypta-box"><strong>Claude</strong> · '+(st.configured?'key found':'no key')
        +(st.configured?'<label>Model<select id="cryptaModel">'+Object.entries(st.models||{}).map(([k,v])=>opt(k,v,k===s.model)).join('')+'</select></label>'
          +'<label>Monthly spending cap ($)<input type="number" id="cryptaCap" min="0" max="500" step="1" value="'+esc(st.capUSD??5)+'"></label>'
          +'<p class="crypta-note">This month: <strong>'+money(st.spentUSD)+'</strong> of '+money(st.capUSD)+' over '+st.requests+' request'+(st.requests===1?'':'s')+'. A typical question costs about '+(st.perQuestionUSD&&st.perQuestionUSD[s.model]?'$'+st.perQuestionUSD[s.model].toFixed(3):'a cent')+'. Estimates from list prices; your Anthropic console is the bill.</p>'
          :'<p class="crypta-note">Paid, and not included in a Claude Pro plan. To use it, save an Anthropic API key as a text file in the <code>private</code> folder.</p>')+'</div>'
      +'<label class="crypta-row"><input type="checkbox" id="cryptaShare" '+(s.share?'checked':'')+'> Let Crypta see the numbers on screen'+(brain()==='claude'?' (sent to Anthropic with your question; never your keys)':'')+'</label>'
      +'<div class="crypta-row"><button type="button" id="cryptaClear">Clear chat</button>'+(STANDALONE&&window.__cryptaInstall?'<button type="button" id="cryptaInstall">Install on taskbar</button>':'')+'</div>';
    const upd=p=>{LS.set('crypta:settings',{...settings(),...p});refreshStatus().then(renderSettings)};
    $('cryptaBrain').addEventListener('change',e=>upd({brain:e.target.value}));
    $('cryptaLocalModel')&&$('cryptaLocalModel').addEventListener('change',e=>upd({localModel:e.target.value}));
    $('cryptaModel')&&$('cryptaModel').addEventListener('change',e=>upd({model:e.target.value}));
    $('cryptaRefresh').addEventListener('click',()=>refreshStatus().then(renderSettings));
    $('cryptaShare').addEventListener('change',e=>LS.set('crypta:settings',{...settings(),share:e.target.checked}));
    $('cryptaCap')&&$('cryptaCap').addEventListener('change',async e=>{try{const r=await fetch('/crypta/settings',{method:'POST',headers:{'Content-Type':'application/json','X-Fable-Local':'1'},body:JSON.stringify({capUSD:+e.target.value})});STATUS={...STATUS,...await r.json()}}catch(x){}renderSettings()});
    el.querySelectorAll('button[data-pull]').forEach(b=>b.addEventListener('click',()=>pullModel(b.dataset.pull)));
    $('cryptaClear').addEventListener('click',()=>{CHAT=[];save();renderLog()});
    $('cryptaInstall')&&$('cryptaInstall').addEventListener('click',async()=>{const p=window.__cryptaInstall;window.__cryptaInstall=null;p.prompt();await p.userChoice.catch(()=>{});renderSettings()});
  }
  async function pullModel(model){
    const out=$('cryptaPull');out.textContent='Starting download of '+model+'…';$('cryptaSettings').querySelectorAll('button[data-pull]').forEach(b=>b.disabled=true);
    try{const r=await fetch('/crypta/local/pull',{method:'POST',headers:{'Content-Type':'application/json','X-Fable-Local':'1'},body:JSON.stringify({model})});
      if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).error||m}catch(e){}throw Error(m)}
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='',last='';
      for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
        while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;let ev;try{ev=JSON.parse(line)}catch(e){continue}
          if(ev.error)throw Error(ev.error);last=ev.status||last;
          // Real Ollama sends a layer's total before any "completed", and a few tiny layers: show GB only for the big one.
          const got=+ev.completed||0;out.textContent=ev.total>=1e8?model+': '+(got/1e9).toFixed(2)+' of '+(ev.total/1e9).toFixed(2)+' GB ('+Math.floor(100*got/ev.total)+'%)':model+': '+last}}
      if(!/success/i.test(last))throw Error('download ended early ('+last+')');
      LS.set('crypta:settings',{...settings(),localModel:model});await refreshStatus();renderSettings();$('cryptaPull')&&($('cryptaPull').textContent=model+' is ready. I will use it for answers.');
    }catch(e){out.textContent='Download failed: '+e.message;$('cryptaSettings').querySelectorAll('button[data-pull]').forEach(b=>b.disabled=false)}
  }

  /* ---------------- talking ---------------- */
  let BUSY=false,ABORT=null;
  async function send(text){
    text=String(text||'').trim();if(!text||BUSY)return;
    if(looksSecret(text)){bubble('user','[message not sent: it contained what looks like a key]');bubble('assistant',"That looks like an **API key or private key**, so I didn't send it anywhere or save it. Treat it as exposed: delete that key where you created it and make a new one. Keys only ever go in as **files in the private folder**, never typed into a chat — including this one.");return}
    CHAT.push({role:'user',text});save();bubble('user',text);$('cryptaInput').value='';
    const state=currentState();
    if(!STATUS)await refreshStatus();
    if(brain()==='guide'){const a=/what can you do|who are you|help$/i.test(text)?"I'm Crypta. I explain this app and your numbers: your Capital plan and its math, how close you are to each limit, your open risk, how your trades are going, and any feature. I can switch tabs and point at fields for you."+(STATUS.offline?'':"\n\nRight now I'm in **guide mode**. For free-form answers where I read anything in the app, give me a brain in settings (⚙): a free local model through Ollama, or Claude with an Anthropic API key."):guideAnswer(text,state);CHAT.push({role:'assistant',text:a});save();bubble('assistant',a);chips();return}
    BUSY=true;$('cryptaSend').textContent='■';$('cryptaSend').setAttribute('aria-label','Stop');
    const out=bubble('assistant','','streaming'),box=out.querySelector('.crypta-text');let shown='';
    const history=CHAT.slice(-20).map(m=>({role:m.role,content:m.text}));while(history.length&&history[0].role!=='user')history.shift();
    try{
      for(let round=0;round<5;round++){
        ABORT=new AbortController();
        const r=await fetch('/crypta/chat',{method:'POST',signal:ABORT.signal,headers:{'Content-Type':'application/json','X-Fable-Local':'1'},credentials:'omit',
          body:JSON.stringify({provider:brain()==='local'?'local':'anthropic',model:brain()==='local'?localModel():settings().model,messages:history,state:settings().share?currentState():null,guide:search(text+' '+(state&&state.tab?state.tab.label:''),3)})});
        if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).error||m}catch(e){}throw Error(m)}
        const blocks=[];let cur=null,stop=null,buf='';const rd=r.body.getReader(),dec=new TextDecoder();
        for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
          while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
            if(ev.type==='content_block_start'){cur={...ev.content_block};if(cur.type==='text')cur.text=cur.text||'';if(cur.type==='tool_use')cur.json='';blocks.push(cur)}
            else if(ev.type==='content_block_delta'&&cur){if(ev.delta.type==='text_delta'){cur.text+=ev.delta.text;shown+=ev.delta.text;box.innerHTML=md(shown);log.scrollTop=log.scrollHeight}else if(ev.delta.type==='input_json_delta')cur.json+=ev.delta.partial_json}
            else if(ev.type==='content_block_stop'){if(cur&&cur.type==='tool_use'){try{cur.input=cur.json?JSON.parse(cur.json):{}}catch(e){cur.input={}}delete cur.json}cur=null}
            else if(ev.type==='message_delta')stop=ev.delta&&ev.delta.stop_reason;
            else if(ev.type==='error')throw Error((ev.error&&ev.error.message)||'Anthropic error');}}
        const uses=blocks.filter(b=>b.type==='tool_use');
        if(stop!=='tool_use'||!uses.length)break;
        history.push({role:'assistant',content:blocks.map(b=>b.type==='text'?{type:'text',text:b.text}:{type:'tool_use',id:b.id,name:b.name,input:b.input}).filter(b=>b.type!=='text'||b.text)});
        const results=[];
        for(const u of uses){let res,err=false;try{res=await tool(u.name,u.input)}catch(e){res=e.message;err=true}
          toolChip(out,u.name,!err);if(shown&&!shown.endsWith('\n'))shown+='\n\n';
          results.push({type:'tool_result',tool_use_id:u.id,content:String(res).slice(0,12000),is_error:err})}
        history.push({role:'user',content:results});
      }
      if(!shown.trim())shown='(no answer)';
      CHAT.push({role:'assistant',text:shown.trim()});save();chips();
    }catch(e){
      const aborted=e.name==='AbortError',fallback=aborted?'':'\n\nFrom my guide instead:\n\n'+guideAnswer(text,state);
      shown+=(shown?'\n\n':'')+(aborted?'_Stopped._':'**I couldn\'t reach '+(brain()==='local'?'the local model':'Claude')+':** '+(e.message==='Failed to fetch'?'Launcher not reachable — is the black window still open?':e.message)+fallback);
      box.innerHTML=md(shown);CHAT.push({role:'assistant',text:shown});save();
    }finally{BUSY=false;ABORT=null;out.classList.remove('streaming');$('cryptaSend').textContent='➤';$('cryptaSend').setAttribute('aria-label','Send');refreshStatus()}
  }
  function retry(){if(BUSY)return;const i=CHAT.map(m=>m.role).lastIndexOf('user');if(i<0)return;const q=CHAT[i].text;CHAT=CHAT.slice(0,i);save();renderLog();send(q)}
  $('cryptaNew').addEventListener('click',()=>{if(BUSY)return;CHAT=[];save();renderLog()});
  $('cryptaForm').addEventListener('submit',e=>{e.preventDefault();if(BUSY&&ABORT){ABORT.abort();return}send($('cryptaInput').value)});
  $('cryptaInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('cryptaForm').requestSubmit()}});
  $('cryptaSettingsBtn').addEventListener('click',()=>{const s=$('cryptaSettings');s.hidden=!s.hidden;if(!s.hidden)renderSettings()});
  if(!STANDALONE){
    const open=v=>{$('cryptaPanel').hidden=!v;$('cryptaFab').classList.toggle('open',v);LS.set('crypta:open',!!v);if(v){$('cryptaInput').focus();refreshStatus();chips()}};
    // Alt+C opens and closes her from anywhere in the tool; the panel keeps its size and comes back open after a reload.
    document.addEventListener('keydown',e=>{if(e.altKey&&!e.ctrlKey&&!e.metaKey&&(e.key==='c'||e.key==='C')){e.preventDefault();open($('cryptaPanel').hidden)}});
    const sz=LS.get('crypta:size',null);if(sz&&sz.w>=320&&sz.h>=380){$('cryptaPanel').style.width=sz.w+'px';$('cryptaPanel').style.height=sz.h+'px'}
    if(typeof ResizeObserver==='function')new ResizeObserver(()=>{const p=$('cryptaPanel');if(!p.hidden&&p.offsetWidth)LS.set('crypta:size',{w:p.offsetWidth,h:p.offsetHeight})}).observe($('cryptaPanel'));
    document.querySelectorAll('nav button[data-p]').forEach(b=>b.addEventListener('click',()=>setTimeout(chips,50)));
    if(LS.get('crypta:open',false))setTimeout(()=>open(true),300);
    $('cryptaFab').addEventListener('click',()=>open($('cryptaPanel').hidden));$('cryptaClose').addEventListener('click',()=>open(false));
    // Her own window lives at the launcher's /crypta, so the button only exists there. A blocked popup gets a pointer instead.
    if($('cryptaPop'))$('cryptaPop').addEventListener('click',()=>{const w=window.open('/crypta','crypta','width=420,height=700');if(w)open(false);else bubble('assistant','Your browser blocked the window. Open **127.0.0.1:'+location.port+'/crypta** in a new tab, then choose Install to put me on the taskbar.')});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('cryptaPanel').hidden)open(false)});
  }else{window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__cryptaInstall=e});renderStatusLine();setInterval(renderStatusLine,3000)}
  if(STANDALONE)refreshStatus();renderLog();   // inside the tools she stays silent (no requests) until opened
  window.crypta={planMath,stageAnswer,journalAnswer,openRiskAnswer,readScreen,readJournal,readAccount,send,search,guideAnswer,explainSize,looksSecret,snapshot,runTool,md,status:()=>STATUS,chat:()=>CHAT};
})();
</script></body></html>
